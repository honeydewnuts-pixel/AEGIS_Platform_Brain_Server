name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'requirements*.txt'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aegis_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check backend/app --select E9,F63,F7,F82 --exit-zero

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit

          pip-audit \
            -r requirements.txt \
            --desc \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281

      - name: Run tests
        env:
          AEGIS_MASTER_KEY: dGVzdF9rZXlfMzJfYnl0ZXNfZXhhY3RseV8h
          ADMIN_BOOTSTRAP_KEY: test-admin-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

      - name: Alembic migration check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aegis_test
        working-directory: backend
        run: alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push - just verify it builds)
        run: docker build -f docker/Dockerfile -t aegis-api:ci .
